    <style>
        /* ===== 方格筆記本配色 ===== */
        :root {
            --paper: #FDFDFB;      /* 紙張底色 */
            --grid: #E3ECF5;       /* 方格線 */
            --ink: #24384D;        /* 主要文字（深藍墨水） */
            --ink-soft: #5E7690;   /* 次要文字 */
            --line: #C9D6E3;       /* 邊框 */
            --pen: #3A6EA5;        /* 點綴色（原子筆藍） */
            --pen-dark: #2F5A88;
            --margin: #F2B8B0;     /* 筆記本紅色邊線 */
            --marker: #FFE58A;     /* 螢光筆黃 */
        }
        body {
            font-family: 'Inter', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            color: var(--ink);
            background-color: var(--paper);
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 24px 24px;
            background-attachment: fixed;
        }

        /* 側邊欄：像筆記本封面內頁，右側有紅色邊線 */
        .notebook-side {
            background: #FBFAF6;
            border-right: 3px double var(--margin);
        }

        /* 品牌名稱：貼著紙膠帶 */
        .brand {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            letter-spacing: 0.08em;
        }
        .brand-tape {
            background: rgba(167, 199, 231, 0.55);
            transform: rotate(-2deg);
        }

        /* 紙膠帶標籤 */
        .tape {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 12px; font-weight: 500;
            padding: 3px 12px;
            transform: rotate(-2deg);
            clip-path: polygon(3% 0, 97% 0, 100% 50%, 97% 100%, 3% 100%, 0 50%);
        }

        /* 卡片：像貼在方格紙上的便條 */
        .project-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 4px;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .project-card:hover {
            transform: translateY(-3px) rotate(-0.4deg);
            box-shadow: 4px 4px 0 var(--line);
        }
        .card-desc {
            background-image: linear-gradient(transparent calc(100% - 1px), var(--line) 1px);
            background-size: 100% 1.75em;
            line-height: 1.75em;
        }

        /* 螢光筆標題 */
        .marker {
            background: linear-gradient(transparent 55%, var(--marker) 55%);
            padding: 0 4px;
        }

        /* 「NEW」紅色印章 */
        .stamp {
            border: 2px solid #D9534F; color: #D9534F;
            font-size: 11px; font-weight: 800; letter-spacing: .08em;
            padding: 1px 6px; border-radius: 4px;
            transform: rotate(8deg);
        }

        /* 導覽按鈕 */
        .nav-btn { transition: background-color .15s ease; border-radius: 6px; }
        .nav-btn:hover { background-color: #EEF3F8; }
        .nav-btn.active { background: linear-gradient(transparent 15%, var(--marker) 15%, var(--marker) 85%, transparent 85%); font-weight: 700; }
        .nav-btn.parent-active { font-weight: 700; }

        /* 區域切換按鈕 */
        .role-btn { border: 2px solid var(--line); color: var(--ink-soft); background: #fff; border-radius: 6px; transition: all .15s ease; }
        .role-btn:hover { border-color: var(--pen); color: var(--ink); }
        .role-btn.active { background: var(--pen); border-color: var(--pen); color: #fff; box-shadow: 3px 3px 0 #BFD0E3; }

        .fade-in { animation: fadeIn 0.25s ease both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <!-- 手機版頂部列 -->
    <div class="md:hidden notebook-side px-6 py-4 flex justify-between items-center z-20 relative border-b border-[#C9D6E3]">
        <h1 class="brand text-xl text-[#24384D] flex items-center gap-2"><span data-icon="box" class="w-6 h-6 text-[#3A6EA5]"></span> CHIEN BOX</h1>
        <button id="mobile-menu-btn" class="text-[#24384D] p-1" aria-label="開啟選單"><span data-icon="menu" class="w-7 h-7"></span></button>
    </div>

    <!-- 側邊欄 -->
    <aside id="sidebar" class="notebook-side w-full md:w-64 h-auto md:h-screen flex-col shrink-0 md:fixed left-0 top-0 hidden md:flex z-10 overflow-y-auto no-scrollbar">
        <div class="px-6 pt-8 pb-6 hidden md:block">
            <h1 class="brand relative inline-flex items-center gap-2 text-2xl text-[#24384D]">
                <span class="brand-tape absolute -inset-x-2 inset-y-1 -z-0"></span>
                <span data-icon="box" class="relative w-7 h-7 text-[#3A6EA5]"></span>
                <span class="relative">CHIEN BOX</span>
            </h1>
            <p class="text-xs text-[#5E7690] mt-3">課堂小工具與學習遊戲</p>
        </div>

        <!-- 區域切換 -->
        <div class="px-4 mb-6 mt-4 md:mt-0">
            <h3 class="text-xs font-bold text-[#8AA0B6] mb-3 px-2 tracking-wider">區域切換</h3>
            <div class="flex flex-col gap-2.5">
                <button class="role-btn active w-full flex items-center justify-center gap-2 px-4 py-2.5 font-bold text-sm" data-role="student">
                    <span data-icon="graduation-cap" class="w-5 h-5"></span> 學生學習區
                </button>
                <button class="role-btn w-full flex items-center justify-center gap-2 px-4 py-2.5 font-bold text-sm" data-role="teacher">
                    <span data-icon="presentation" class="w-5 h-5"></span> 教師工具區 <span id="lock-icon" class="inline-flex"></span>
                </button>
            </div>
        </div>

        <!-- 導覽選單（由程式自動產生） -->
        <div class="px-4 flex-1 mb-8">
            <h3 class="text-xs font-bold text-[#8AA0B6] mb-3 px-2 tracking-wider">導覽選單</h3>
            <nav class="space-y-1" id="nav-container"></nav>
        </div>

        <div class="px-6 py-5 text-xs text-[#5E7690] border-t border-dashed border-[#C9D6E3]">
            <p>© CHIEN BOX</p>
        </div>
    </aside>

    <!-- 主內容 -->
    <main class="flex-1 md:ml-64 p-6 md:p-10 w-full max-w-7xl mx-auto">
        <div class="mb-6">
            <p id="breadcrumb" class="text-sm text-[#5E7690] mb-2"></p>
            <h2 id="page-title" class="text-2xl font-bold text-[#24384D] flex items-center gap-2"></h2>
        </div>

        <!-- 搜尋框 -->
        <div class="relative mb-10 max-w-xl">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#5E7690] pointer-events-none"><span data-icon="search" class="w-5 h-5"></span></span>
            <input id="search-input" type="search" autocomplete="off"
                   class="w-full pl-12 pr-12 py-3 rounded-md border-2 border-[#C9D6E3] bg-white text-[#24384D] placeholder-[#9DB0C4] focus:outline-none focus:border-[#3A6EA5] transition"
                   placeholder="搜尋工具，例如：成語、乘法、生字">
            <button id="search-clear" class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full text-[#5E7690] hover:bg-[#EEF3F8] flex items-center justify-center" aria-label="清除搜尋"><span data-icon="x" class="w-4 h-4"></span></button>
        </div>

        <div id="content"></div>
    </main>

    <!-- 密碼視窗 -->
    <div id="password-modal" class="fixed inset-0 bg-[#24384D] bg-opacity-40 hidden flex items-center justify-center z-50 backdrop-blur-sm transition-opacity opacity-0">
        <div class="relative bg-white p-8 pt-10 rounded max-w-sm w-full mx-4 transform transition-transform scale-95 border border-[#C9D6E3] shadow-[6px_6px_0_#C9D6E3]" id="modal-content">
            <span class="tape absolute -top-3 left-1/2 -translate-x-1/2 bg-[#A7C7E7] text-[#24384D]">教師專用</span>
            <div class="text-center">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full border-2 border-dashed border-[#C9D6E3] text-[#3A6EA5] flex items-center justify-center"><span data-icon="lock-keyhole" class="w-8 h-8"></span></div>
                <h3 class="text-2xl font-bold text-[#24384D] mb-6">請輸入密碼</h3>
                <input type="password" id="teacher-password" class="w-full px-4 py-3 border-2 border-[#C9D6E3] rounded-md mb-2 focus:outline-none focus:border-[#3A6EA5] text-center text-lg transition bg-[#FBFAF6]" placeholder="提示buzies">
                <p id="password-error" class="text-red-500 text-sm mb-4 h-5 invisible">密碼錯誤，請再試一次</p>
                <div class="flex gap-3 justify-center mt-2">
                    <button id="btn-cancel-pwd" class="flex-1 px-4 py-2.5 rounded-md border-2 border-[#C9D6E3] text-[#24384D] hover:bg-[#EEF3F8] transition font-medium">取消</button>
                    <button id="btn-submit-pwd" class="flex-1 px-4 py-2.5 rounded-md bg-[#3A6EA5] border-2 border-[#3A6EA5] text-white hover:bg-[#2F5A88] transition font-medium">解鎖</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

        // ======== 設定您的教師密碼 ========
        const TEACHER_PASSWORD = "24350705";
        // ==================================

        // 圖示（Lucide）
        const ICONS = {
            'graduation-cap': '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" /> <path d="M22 10v6" /> <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />',
            'presentation': '<path d="M2 3h20" /> <path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3" /> <path d="m7 21 5-5 5 5" />',
            'lock': '<rect width="18" height="11" x="3" y="11" rx="2" ry="2" /> <path d="M7 11V7a5 5 0 0 1 10 0v4" />',
            'lock-open': '<rect width="18" height="11" x="3" y="11" rx="2" ry="2" /> <path d="M7 11V7a5 5 0 0 1 9.9-1" />',
            'layout-grid': '<rect width="7" height="7" x="3" y="3" rx="1" /> <rect width="7" height="7" x="14" y="3" rx="1" /> <rect width="7" height="7" x="14" y="14" rx="1" /> <rect width="7" height="7" x="3" y="14" rx="1" />',
            'sprout': '<path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3" /> <path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4" /> <path d="M5 21h14" />',
            'trees': '<path d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0 1 6 0Z" /> <path d="M7 16v6" /> <path d="M13 19v3" /> <path d="M12 19h8.3a1 1 0 0 0 .7-1.7L18 14h.3a1 1 0 0 0 .7-1.7L16 9h.2a1 1 0 0 0 .8-1.7L13 3l-1.4 1.5" />',
            'book-open': '<path d="M12 5v16" /> <path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z" />',
            'calculator': '<rect width="16" height="20" x="4" y="2" rx="2" /> <line x1="8" x2="16" y1="6" y2="6" /> <line x1="16" x2="16" y1="14" y2="18" /> <path d="M16 10h.01" /> <path d="M12 10h.01" /> <path d="M8 10h.01" /> <path d="M12 14h.01" /> <path d="M8 14h.01" /> <path d="M12 18h.01" /> <path d="M8 18h.01" />',
            'wrench': '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z" />',
            'search': '<path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" />',
            'x': '<path d="M18 6 6 18" /> <path d="m6 6 12 12" />',
            'lock-keyhole': '<circle cx="12" cy="16" r="1" /> <rect x="3" y="10" width="18" height="12" rx="2" /> <path d="M7 10V7a5 5 0 0 1 10 0v3" />',
            'search-x': '<path d="m13.5 8.5-5 5" /> <path d="m8.5 8.5 5 5" /> <circle cx="11" cy="11" r="8" /> <path d="m21 21-4.3-4.3" />',
            'menu': '<path d="M4 5h16" /> <path d="M4 12h16" /> <path d="M4 19h16" />',
            'box': '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /> <path d="m3.3 7 8.7 5 8.7-5" /> <path d="M12 22V12" />',
            'arrow-up-right': '<path d="M7 7h10v10" /> <path d="M7 17 17 7" />',
        };
        // 產生 SVG 圖示：ic('book-open', 'w-5 h-5')
        const ic = (name, cls = 'w-5 h-5') =>
            `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls} shrink-0" aria-hidden="true">${ICONS[name] || ''}</svg>`;
        // 把 HTML 裡的 <span data-icon="..."> 換成圖示
        document.querySelectorAll('[data-icon]').forEach(el => { el.outerHTML = ic(el.dataset.icon, el.className || 'w-5 h-5'); });

        // 【資源清單】以後新增工具，只要在對應區塊複製一行修改即可
        //   area:    'teacher'（教師工具區）、'low'（低年級）、'mid'（中年級）
        //   subject: 'chinese'（國語）、'math'（數學）、'tool'（教師工具）
        //   isNew:   true 會蓋上「NEW」印章
        const RESOURCES = [
            // ---------- 國小低年級．國語 ----------
            { area: 'low', subject: 'chinese', title: '康軒小一國字複習區', desc: '詞語填空複習康軒小一生字應用', url: 'https://uniquechien0309.github.io/114-1/' },
            { area: 'low', subject: 'chinese', title: '114-2康軒國語二下生字庫', desc: '抽出生字練習造詞。', url: 'https://gemini.google.com/share/e5e373659d5a' },
            { area: 'low', subject: 'chinese', title: '康軒二下期中考成語挑戰賽', desc: '用成語填空題檢測成語應用能力', url: 'https://gemini.google.com/share/f40be256f2bc' },
            { area: 'low', subject: 'chinese', title: '餵餵寵物', desc: '康軒二下期末考成語練習', url: 'https://gemini.google.com/share/85585bc9a3eb' },

            // ---------- 國小低年級．數學 ----------
            { area: 'low', subject: 'math', title: '數學翻翻樂', desc: '兩位數加減、三位數加減與簡單乘法，最多四人一起挑戰。', url: 'https://gemini.google.com/share/179b6e951a85' },
            { area: 'low', subject: 'math', title: '乘法情境選擇題', desc: '熟悉單位量x單位數=總量。', url: 'https://chiateach.my.canva.site/dag5wp-zxja' },
            { area: 'low', subject: 'math', title: '九九乘法競技場', desc: '互動式的乘法挑戰練習。', url: 'https://sites.google.com/view/multiplicationolympic/full-page-embed' },

            // ---------- 國小中年級．國語 ----------
            { area: 'mid', subject: 'chinese', title: '115-1康軒三上期中考成語迷航', desc: '句子填空檢測成語的熟悉度', url: 'https://sites.google.com/view/ks115-13rdmidterm/full-page-embed' },

            // ---------- 國小中年級．數學 ----------
            { area: 'mid', subject: 'math', title: '速算火箭', desc: '加減乘除運算練習。', url: 'https://chiateach.my.canva.site/mathrocket' },
            { area: 'mid', subject: 'math', title: 'Multiquence 乘法序列挑戰', desc: '結合 Sequence 玩法的九九乘法桌遊，分組對戰連線，三種難度可選。', url: 'https://uniquechien0309.github.io/multiquence/', isNew: true },

            // ---------- 教師工具區 ----------
            { area: 'teacher', subject: 'tool', title: '視覺化計時器', desc: '利用圓餅圖設計，將抽象時間具體化呈現並可分段顯示', url: 'https://gemini.google.com/share/bc06357f11ab' },
            { area: 'teacher', subject: 'tool', title: '課前倒數與數字挑戰', desc: '倒數一分鐘靜心與動動腦。', url: 'https://sites.google.com/view/targetnumber/full-page-embed' },
            { area: 'teacher', subject: 'tool', title: 'Classroom Minesweeper', desc: '學生發表次數限制紀錄，搭配煙火放送次數功能', url: 'https://gemini.google.com/share/de82b3061eaf' },
            { area: 'teacher', subject: 'tool', title: '排座位了老師', desc: '拉動學生姓名排座位。', url: 'https://chiateach.my.canva.site/dag4gwq8x3k' },
            { area: 'teacher', subject: 'tool', title: 'Boooonk', desc: '打擊壞心情', url: 'https://uniquechien0309.github.io/boooonk/' },
            { area: 'teacher', subject: 'tool', title: '115學年度康軒國語一上至三上生字查詢與檢測系統', desc: '輸入生字或段落檢驗生字是否已學習過', url: 'https://uniquechien0309.github.io/wordsearch/' },
        ];

        // 年級與科目的顯示設定（tape = 紙膠帶顏色、tapeText = 膠帶上的字色）
        const GRADES = {
            low: { name: '國小低年級', short: '低年級', icon: 'sprout', note: '一、二年級' },
            mid: { name: '國小中年級', short: '中年級', icon: 'trees',  note: '三、四年級' },
        };
        const SUBJECTS = {
            chinese: { name: '國語',     icon: 'book-open',  tape: '#F7C9B6', tapeText: '#7A3B22', color: '#B4603A' },
            math:    { name: '數學',     icon: 'calculator', tape: '#CFE3B5', tapeText: '#3F5A1E', color: '#5B7F2F' },
            tool:    { name: '教師工具', icon: 'wrench',     tape: '#D9D0EC', tapeText: '#4B3B78', color: '#6A58A0' },
        };

        // ======== 狀態 ========
        let state = { role: 'student', grade: 'all', subject: 'all' };
        let teacherUnlocked = false;

        const nav = document.getElementById('nav-container');
        const content = document.getElementById('content');
        const pageTitle = document.getElementById('page-title');
        const breadcrumb = document.getElementById('breadcrumb');
        const sidebar = document.getElementById('sidebar');
        const roleBtns = document.querySelectorAll('.role-btn');
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        function clearSearch() {
            searchInput.value = '';
            searchClear.classList.add('hidden');
        }

        const escapeHTML = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        // 工具所在位置（顯示在紙膠帶上）
        const locationLabel = r => r.area === 'teacher' ? '教師工具' : `${GRADES[r.area].short}．${SUBJECTS[r.subject].name}`;

        // ======== 卡片 ========
        function cardHTML(r) {
            const s = SUBJECTS[r.subject];
            return `
            <a href="${escapeHTML(r.url)}" target="_blank" rel="noopener" class="project-card fade-in relative px-6 pt-8 pb-6 flex flex-col h-full">
                <span class="tape absolute -top-3 left-5" style="background:${s.tape};color:${s.tapeText}">${ic(s.icon, 'w-3.5 h-3.5')} ${locationLabel(r)}</span>
                ${r.isNew ? '<span class="stamp absolute top-3 right-4">NEW</span>' : ''}
                <h3 class="text-lg font-bold text-[#24384D] leading-snug mb-3 ${r.isNew ? 'pr-12' : ''}">${escapeHTML(r.title)}</h3>
                <p class="card-desc text-[#5E7690] text-sm">${escapeHTML(r.desc)}</p>
                <span class="mt-auto pt-4 self-end inline-flex items-center gap-1 text-sm font-medium" style="color:${s.color}">開啟 ${ic('arrow-up-right', 'w-4 h-4')}</span>
            </a>`;
        }
        const gridHTML = list => list.length
            ? `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-x-6 gap-y-9 pt-3">${list.map(cardHTML).join('')}</div>`
            : `<p class="text-[#5E7690] text-sm py-6">這裡還沒有資源，敬請期待！</p>`;

        // ======== 導覽選單 ========
        function navBtn({ label, icon, active, parentActive, indent, data }) {
            const cls = active ? 'active' : (parentActive ? 'parent-active' : '');
            const dataAttrs = Object.entries(data).map(([k, v]) => `data-${k}="${v}"`).join(' ');
            return `<button class="nav-btn ${cls} w-full flex items-center gap-3 ${indent ? 'pl-10 pr-4 py-2 text-sm' : 'px-4 py-2.5'} text-left text-[#24384D] font-medium" ${dataAttrs}>
                        ${ic(icon, indent ? 'w-4 h-4' : 'w-5 h-5')} ${label}
                    </button>`;
        }

        function renderNav() {
            if (state.role === 'teacher') {
                nav.innerHTML = navBtn({ label: '全部教師工具', icon: 'wrench', active: true, data: { grade: 'all', subject: 'all' } });
                return;
            }
            let html = navBtn({ label: '全部資源', icon: 'layout-grid', active: state.grade === 'all', data: { grade: 'all', subject: 'all' } });
            for (const [gk, g] of Object.entries(GRADES)) {
                const inGrade = state.grade === gk;
                html += `<div class="pt-2">`;
                html += navBtn({ label: g.name, icon: g.icon, active: inGrade && state.subject === 'all', parentActive: inGrade && state.subject !== 'all', data: { grade: gk, subject: 'all' } });
                for (const sk of ['chinese', 'math']) {
                    const count = RESOURCES.filter(r => r.area === gk && r.subject === sk).length;
                    html += navBtn({
                        label: `${SUBJECTS[sk].name} <span class="ml-auto text-xs text-[#8AA0B6]">${count}</span>`,
                        icon: SUBJECTS[sk].icon, indent: true,
                        active: inGrade && state.subject === sk,
                        data: { grade: gk, subject: sk }
                    });
                }
                html += `</div>`;
            }
            nav.innerHTML = html;
        }

        // ======== 搜尋 ========
        // 比對標題、說明、年級與科目名稱；多個關鍵字用空白隔開，需全部符合
        function searchResources(query) {
            const words = query.toLowerCase().split(/\s+/).filter(Boolean);
            const inRole = r => state.role === 'teacher' ? r.area === 'teacher' : r.area !== 'teacher';
            return RESOURCES.filter(r => {
                if (!inRole(r)) return false;
                const g = GRADES[r.area];
                const text = `${r.title} ${r.desc} ${locationLabel(r)} ${g ? g.name + ' ' + g.note : ''}`.toLowerCase();
                return words.every(w => text.includes(w));
            });
        }

        function renderSearch(query) {
            const results = searchResources(query);
            breadcrumb.textContent = state.role === 'teacher' ? '教師工具區 › 搜尋' : '學生學習區 › 搜尋';
            pageTitle.innerHTML = `${ic('search', 'w-6 h-6')} <span class="marker">「${escapeHTML(query)}」的搜尋結果</span>`;
            content.innerHTML = results.length
                ? `<p class="text-sm text-[#5E7690] mb-4">找到 ${results.length} 個工具</p>` + gridHTML(results)
                : `<div class="text-center py-16 text-[#5E7690]">
                       <div class="w-14 h-14 mx-auto mb-3 rounded-full border-2 border-dashed border-[#C9D6E3] flex items-center justify-center">${ic('search-x', 'w-7 h-7')}</div>
                       <p>找不到符合「${escapeHTML(query)}」的工具</p>
                       <p class="text-sm mt-1">換個關鍵字試試看，例如：成語、乘法、生字</p>
                   </div>`;
        }

        // ======== 主畫面 ========
        const setTitle = (icon, text) => { pageTitle.innerHTML = `<span class="text-[#3A6EA5]">${ic(icon, 'w-6 h-6')}</span> <span class="marker">${text}</span>`; };

        function renderContent() {
            const query = searchInput.value.trim();
            if (query) { renderSearch(query); return; }

            if (state.role === 'teacher') {
                breadcrumb.textContent = '教師工具區';
                setTitle('presentation', '教師工具區');
                content.innerHTML = gridHTML(RESOURCES.filter(r => r.area === 'teacher'));
                return;
            }

            const grades = state.grade === 'all' ? Object.keys(GRADES) : [state.grade];
            const subjects = state.subject === 'all' ? ['chinese', 'math'] : [state.subject];

            if (state.grade === 'all') {
                breadcrumb.textContent = '學生學習區';
                setTitle('layout-grid', '全部資源');
            } else if (state.subject === 'all') {
                breadcrumb.textContent = `學生學習區 › ${GRADES[state.grade].name}`;
                setTitle(GRADES[state.grade].icon, GRADES[state.grade].name);
            } else {
                breadcrumb.textContent = `學生學習區 › ${GRADES[state.grade].name} › ${SUBJECTS[state.subject].name}`;
                setTitle(SUBJECTS[state.subject].icon, `${GRADES[state.grade].name}．${SUBJECTS[state.subject].name}`);
            }

            if (state.grade !== 'all' && state.subject !== 'all') {
                content.innerHTML = gridHTML(RESOURCES.filter(r => r.area === state.grade && r.subject === state.subject));
                return;
            }

            let html = '';
            for (const gk of grades) {
                const g = GRADES[gk];
                if (state.grade === 'all') {
                    html += `<h3 class="text-xl font-bold text-[#24384D] mb-6 flex items-center gap-2">
                                <span class="text-[#3A6EA5]">${ic(g.icon, 'w-6 h-6')}</span>
                                <span class="marker">${g.name}</span>
                                <span class="text-sm font-normal text-[#5E7690]">${g.note}</span>
                             </h3>`;
                }
                for (const sk of subjects) {
                    const list = RESOURCES.filter(r => r.area === gk && r.subject === sk);
                    html += `<section class="mb-10">
                                <h4 class="text-base font-bold mb-3 flex items-center gap-2 pb-1 border-b-2 border-dashed border-[#C9D6E3]" style="color:${SUBJECTS[sk].color}">
                                    ${ic(SUBJECTS[sk].icon, 'w-5 h-5')} ${SUBJECTS[sk].name}
                                </h4>
                                ${gridHTML(list)}
                             </section>`;
                }
                if (state.grade === 'all') html += `<div class="h-4"></div>`;
            }
            content.innerHTML = html;
        }

        function render() {
            roleBtns.forEach(b => b.classList.toggle('active', b.dataset.role === state.role));
            document.getElementById('lock-icon').innerHTML = ic(teacherUnlocked ? 'lock-open' : 'lock', 'w-4 h-4');
            renderNav();
            renderContent();
        }

        const closeMobileMenu = () => { if (window.innerWidth < 768) sidebar.classList.add('hidden'); };

        // ======== 事件 ========
        document.getElementById('mobile-menu-btn').addEventListener('click', () => sidebar.classList.toggle('hidden'));

        nav.addEventListener('click', e => {
            const btn = e.target.closest('.nav-btn');
            if (!btn) return;
            state.grade = btn.dataset.grade;
            state.subject = btn.dataset.subject;
            clearSearch();
            render();
            closeMobileMenu();
        });

        roleBtns.forEach(btn => btn.addEventListener('click', () => {
            const role = btn.dataset.role;
            if (role === state.role) return;
            if (role === 'teacher' && !teacherUnlocked) { showModal(); return; }
            state = { role, grade: 'all', subject: 'all' };
            clearSearch();
            render();
            closeMobileMenu();
        }));

        // 搜尋框
        searchInput.addEventListener('input', () => {
            searchClear.classList.toggle('hidden', !searchInput.value);
            renderContent();
        });
        searchClear.addEventListener('click', () => { clearSearch(); renderContent(); searchInput.focus(); });
        searchInput.addEventListener('keydown', e => { if (e.key === 'Escape') { clearSearch(); renderContent(); } });

        // ======== 密碼視窗 ========
        const modal = document.getElementById('password-modal');
        const modalContent = document.getElementById('modal-content');
        const passwordInput = document.getElementById('teacher-password');
        const errorText = document.getElementById('password-error');

        function showModal() {
            modal.classList.remove('hidden');
            errorText.classList.add('invisible');
            passwordInput.classList.remove('border-red-400');
            passwordInput.value = '';
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.replace('scale-95', 'scale-100');
                passwordInput.focus();
            }, 10);
        }
        function hideModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.replace('scale-100', 'scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
        function checkPassword() {
            if (passwordInput.value === TEACHER_PASSWORD) {
                teacherUnlocked = true;
                hideModal();
                state = { role: 'teacher', grade: 'all', subject: 'all' };
                clearSearch();
                render();
                closeMobileMenu();
            } else {
                errorText.classList.remove('invisible');
                passwordInput.classList.add('border-red-400');
                modalContent.style.transform = 'translateX(10px)';
                setTimeout(() => modalContent.style.transform = 'translateX(-10px)', 50);
                setTimeout(() => modalContent.style.transform = '', 100);
            }
        }

        document.getElementById('btn-cancel-pwd').addEventListener('click', hideModal);
        document.getElementById('btn-submit-pwd').addEventListener('click', checkPassword);
        passwordInput.addEventListener('keydown', e => {
            passwordInput.classList.remove('border-red-400');
            errorText.classList.add('invisible');
            if (e.key === 'Enter') checkPassword();
        });
        modal.addEventListener('click', e => { if (e.target === modal) hideModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.classList.contains('hidden')) hideModal(); });

        render();
    });
    </script>
</body>
</html>
